name: Daily Miami Fruit Prices Update

on:
  schedule:
    - cron: '30 13 * * *'   # Runs daily at 9:30 AM ET (13:30 UTC)
  workflow_dispatch:        # Manual trigger button in GitHub

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run scraper
        run: python scraper.py
        
      - name: Commit new report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/
          git commit -m "Daily update: Miami Terminal Fruit Prices $(date +%Y-%m-%d)" || echo "No changes"
          git push
